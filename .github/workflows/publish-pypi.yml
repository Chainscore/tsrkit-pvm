name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux x86_64 - with recompiler
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            cibw_arch: x86_64

          # Linux ARM64 - without recompiler (skip on PRs to save time)
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04
            cibw_arch: aarch64
            skip_on_pr: true

          # macOS Intel - without recompiler
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            cibw_arch: x86_64

          # macOS Apple Silicon - without recompiler
          - os: macos
            arch: arm64
            runner: macos-14
            cibw_arch: arm64


    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for ARM on x86)
        if: matrix.arch == 'aarch64' && (matrix.skip_on_pr != true || github.event_name != 'pull_request')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: "PVM_BUILD_MODE=cython"
          CIBW_BEFORE_BUILD: pip install "setuptools>=61.0,<77.0.0" wheel cython
          CIBW_TEST_SKIP: "*"

      - uses: actions/upload-artifact@v4
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  test_wheels:
    name: Test wheels on ${{ matrix.os }} for ${{ matrix.arch }}
    needs: [build_wheels]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux x86_64 - test both modes
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            test_recompiler: true

          # Linux ARM64 - test interpreter only (skip on PRs)
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04
            test_recompiler: false
            skip_on_pr: true

          # macOS Intel - test interpreter only
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            test_recompiler: false

          # macOS Apple Silicon - test interpreter only
          - os: macos
            arch: arm64
            runner: macos-14
            test_recompiler: false


    steps:
      - uses: actions/checkout@v4
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        with:
          submodules: recursive

      - name: Set up Python 3.12
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheels
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

      - name: Install wheel
        if: (matrix.skip_on_pr != true || github.event_name != 'pull_request') && matrix.arch != 'aarch64'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Install from the dist directory; pip will pick the wheel for this runner.
          python -m pip install --find-links=dist/ tsrkit-pvm

      - name: Verify aarch64 wheel artifact
        if: (matrix.skip_on_pr != true || github.event_name != 'pull_request') && matrix.arch == 'aarch64'
        shell: bash
        run: |
          echo "Verifying aarch64 wheel artifact..."
          ls -la dist/
          python - <<'PY'
          import glob, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("No wheel artifacts found in dist/")
              sys.exit(1)
          print("Found wheels:", wheels)
          PY

      - name: Prepare installed-wheel test workspace
        if: (matrix.skip_on_pr != true || github.event_name != 'pull_request') && matrix.arch != 'aarch64'
        shell: bash
        run: |
          test -f tests/ext/pvm/programs/gas_basic_consume_all.json
          test_root="$(mktemp -d)"
          cp -R tests "$test_root/tests"
          echo "TEST_ROOT=$test_root" >> "$GITHUB_ENV"

      - name: Test installed wheel interpreter and Cython vectors
        if: (matrix.skip_on_pr != true || github.event_name != 'pull_request') && matrix.arch != 'aarch64'
        shell: bash
        run: |
          cd "$TEST_ROOT"
          python -m pytest tests/test_pvm_gas_accounting.py -q
          python -m pytest tests/test_vectors.py::test_vectors_intr -q
          python -m pytest tests/test_vectors.py::test_vectors_cython -q

      - name: Test installed wheel recompiler vectors
        if: matrix.test_recompiler == true && (matrix.skip_on_pr != true || github.event_name != 'pull_request')
        shell: bash
        run: |
          cd "$TEST_ROOT"
          python -m pytest tests/test_vectors.py::test_vectors_recompiler -q

      - name: Test installed wheel standalone gas block vectors
        if: matrix.test_recompiler == true && github.event_name != 'pull_request'
        shell: bash
        run: |
          cd "$TEST_ROOT"
          python -m pytest tests/test_vectors.py::test_vectors_gas_only_block_costs -q

      - name: Summary
        if: matrix.skip_on_pr != true || github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ "${{ matrix.test_recompiler }}" = "true" ]; then
            echo "Platform: ${{ matrix.os }} ${{ matrix.arch }}"
            echo "✓ Interpreter and Cython Koute vectors passed"
            echo "✓ Recompiler Koute vectors passed"
          else
            echo "Platform: ${{ matrix.os }} ${{ matrix.arch }}"
            echo "✓ Interpreter and Cython Koute vectors passed"
            echo "- Recompiler mode: Not supported on this platform"
          fi

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cython "setuptools>=61.0,<77.0.0" wheel

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, test_wheels, build_sdist]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
