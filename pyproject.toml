[tool.poetry]
name = "tsrkit-pvm"
version = "0.1.0"
description = "Polkadot Virtual Machine (PVM) implementation with interpreter and recompiler as specified in GP"
readme = "README.md"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
authors = ["Chainscore Labs <hello@chainscore.finance>"]
maintainers = ["Chainscore Labs <hello@chainscore.finance>"]
keywords = [
    "virtual-machine",
    "pvm",
    "interpreter",
    "recompiler",
    "tessera",
    "blockchain",
    "execution-engine",
    "polkadot",
    "substrate",
    "blockchain",
    "evm",
    "wasm",
    "smart-contracts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Emulators",
    "Topic :: Software Development :: Interpreters",
]
homepage = "https://github.com/chainscore/tsrkit-pvm"
repository = "https://github.com/chainscore/tsrkit-pvm"
documentation = "https://github.com/chainscore/tsrkit-pvm"

packages = [
    { include = "tsrkit_pvm" }
]

include = [
    { path = "tsrkit_pvm/py.typed" },
    { path = "tsrkit_pvm/recompiler/segwrap/libsegwrap.so" }
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
tsrkit_types = { path = "../tsrkit-types", develop = true }
tsrkit_asm = { path = "../tsrkit-asm", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
black = ">=23.0.0"
isort = ">=5.12.0"
flake8 = ">=6.0.0"
mypy = ">=1.0.0"
pre-commit = ">=3.0.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-benchmark = ">=4.0.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=6.0.0"
sphinx-rtd-theme = ">=1.2.0"
myst-parser = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["tsrkit_pvm"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tsrkit_types.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["tsrkit_pvm"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
