name: PVM Vector Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'sync/**'
  workflow_dispatch:

jobs:
  koute_vectors:
    name: Koute vectors on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            test_recompiler: true
            test_gas_only: true
          - name: macos-x86_64
            runner: macos-15-intel
            test_recompiler: false
            test_gas_only: false
          - name: macos-arm64
            runner: macos-14
            test_recompiler: false
            test_gas_only: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Cython extensions in place
        shell: bash
        run: PVM_BUILD_MODE=cython python setup.py build_ext --inplace

      - name: Test interpreter and Cython vectors
        shell: bash
        run: |
          python -m pytest tests/test_pvm_gas_accounting.py -q
          python -m pytest tests/test_vectors.py::test_vectors_intr -q
          python -m pytest tests/test_vectors.py::test_vectors_cython -q

      - name: Test recompiler vectors
        if: matrix.test_recompiler == true
        shell: bash
        run: python -m pytest tests/test_vectors.py::test_vectors_recompiler -q

      - name: Test standalone gas block vectors
        if: matrix.test_gas_only == true
        shell: bash
        run: python -m pytest tests/test_vectors.py::test_vectors_gas_only_block_costs -q
